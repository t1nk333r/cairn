<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#22302d"/>
  <g>
    <!-- Chunky enough to read as rock rather than as lines of text, each one
         tilted the opposite way to the one below so the stack looks balanced
         by hand. Lighter toward the top, the way weathered stone stacks. -->
    <rect x="24" y="88" width="80" height="25" rx="12.5" transform="rotate(-3 64 100)" fill="#bdb19b"/>
    <rect x="33" y="60" width="62" height="22" rx="11" transform="rotate(4 64 71)" fill="#d7cdb9"/>
    <rect x="43" y="36" width="44" height="19" rx="9.5" transform="rotate(-5 65 45)" fill="#ebe4d6"/>
    <rect x="52" y="16" width="28" height="16" rx="8" transform="rotate(4 66 24)" fill="#fdfaf3"/>
  </g>
</svg>
