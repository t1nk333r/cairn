name: Release

# Tag a version to cut a release:
#   npm version 0.2.0 && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for a manual re-run)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` is not an available context in a step-level `if`, but it is at
    # job level, so presence is resolved once here into a plain string flag.
    env:
      # One source of truth for the version under release: the pushed tag, or
      # the tag named in a manual re-run.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY != '' }}
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual re-run must build the tag, not the default branch.
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Never ship an artifact that has not passed the same gate as main.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox

      - name: Confirm the tag matches the manifest version
        run: |
          VERSION="${TAG#v}"
          MANIFEST=$(node -p "require('./.output/chrome-mv3/manifest.json').version")
          echo "tag=$VERSION manifest=$MANIFEST"
          test "$VERSION" = "$MANIFEST" || {
            echo "::error::Tag $VERSION does not match manifest version $MANIFEST. Run npm version first."
            exit 1
          }

      # An .xpi whose manifest lost its update_url is an .xpi that never checks
      # for a new version again, and the user cannot tell. tests/update-manifest
      # already proves updates.json lists this version; this proves the shipped
      # build actually points at it.
      - name: Confirm the Firefox build points at the update manifest
        run: |
          EXPECTED=$(node -p "require('./package.json').cairn.updateManifestUrl")
          ACTUAL=$(node -p "require('./.output/firefox-mv3/manifest.json').browser_specific_settings.gecko.update_url ?? ''")
          echo "expected=$EXPECTED actual=$ACTUAL"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::The Firefox manifest does not point at $EXPECTED, so this build would never auto-update."
            exit 1
          }

      - name: Package store archives
        run: |
          npm run zip
          npm run zip:firefox

      # A CRX is only signable with the private key that defines the extension
      # id, and that key is deliberately not held in Actions secrets: it is the
      # permanent extension identity, and leaking it means a new id and a
      # reinstall for every user. With the secret absent this step is skipped
      # and no .crx is attached. If you ever do add CRX_PRIVATE_KEY, update the
      # release body below, which currently states that no .crx is shipped.
      - name: Sign the CRX
        if: env.HAS_CRX_KEY == 'true'
        env:
          CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          printf '%s' "$CRX_KEY" > /tmp/cairn.pem
          npx --yes crx3 -p /tmp/cairn.pem -o ".output/cairn-${TAG#v}.crx" .output/chrome-mv3
          shred -u /tmp/cairn.pem

      # Mozilla-signed XPI. This is the one artifact a user can genuinely
      # click and install: AMO signs unlisted add-ons for self-hosting, and
      # Firefox refuses anything unsigned.
      - name: Sign the XPI with AMO
        if: env.HAS_AMO_KEYS == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir .output/firefox-mv3 \
            --artifacts-dir .output/signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          mv .output/signed/*.xpi ".output/cairn-${TAG#v}.xpi"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            .output/*.zip
            .output/*.crx
            .output/*.xpi
          body: |
            ## Install

            **Firefox** — download `cairn-*.xpi` and open it. Mozilla signs it
            for self-hosting, so release Firefox installs it and then keeps it
            updated automatically. Coming from 0.1.0? Reinstall once — that
            build shipped without an update manifest and cannot update itself.

            **Chromium / Helium / Brave** — download `cairn-*-chrome.zip`,
            unzip it, then `chrome://extensions` → enable Developer mode →
            **Load unpacked** → pick the unzipped folder.

            Google Chrome refuses off-store `.crx` installs, so no `.crx` is
            attached here. For enterprise policy deployment, build one from
            this tag with `npm run pack:crx` and your own signing key.

            `cairn-*-sources.zip` is the corresponding source archive for
            this build, as AGPL-3.0-or-later requires.
